[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "options-tastytrade"
version = "0.1.0"
description = "Research-first option-chain analysis with Tastytrade data"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OptionsTastyTrade contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
